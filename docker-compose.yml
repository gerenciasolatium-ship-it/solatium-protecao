# Infra local para desenvolvimento: Postgres + Redis.
# Uso: docker compose up -d   (requer Docker instalado)
# Em produção esses serviços são plugins do Railway (ver DEPLOY.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: solatium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solatium
      POSTGRES_PASSWORD: solatium
      POSTGRES_DB: solatium
    ports:
      - '5432:5432'
    volumes:
      - solatium_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solatium']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solatium-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - solatium_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  solatium_pg:
  solatium_redis:
