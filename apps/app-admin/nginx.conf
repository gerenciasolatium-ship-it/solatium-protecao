# nginx SPA config — app-admin (Proteção Solatium)
# Serve o bundle Vite e faz fallback para index.html (rotas client-side).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip básico para assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache agressivo para assets versionados (hash no nome).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota desconhecida devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
